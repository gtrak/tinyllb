# Proxy configuration — PRD §7
#
# This file is the single source of truth for the tinyllb.
# Environment variables (TINYLLB__*) override values here.
# Copy to config.yaml and edit, or mount as /etc/tinyllb/config.yaml
# in Docker.

backend:
  url: http://localhost:8000

scheduler:
  algorithm: drr
  max_active_flows: 4
  starvation_timeout: 300s

flows:
  default_weight: 1

priorities:
  interactive: 100
  agent: 50
  background: 10

server:
  bind: "0.0.0.0:8080"
  tps_window_secs: 10

context_policy:
  enabled: false                # set true to activate context compression
  compress_threshold: 100000    # est. tokens to trigger compression
  head_keep_turns: 3            # turns kept verbatim at start (prefix-cache anchor)
  live_keep_turns: 6            # turns kept verbatim at end (recent context)
  compress_chunk_turns: 8       # turns folded into each compressed summary
  summary_max_tokens: 2048      # max tokens for sidecar summarization
  store_path: "~/.local/share/tinyllb/transcripts.db"
  tokenizer_path: null          # path to tokenizer.json for accurate token counts
  sidecar_request_timeout: 60s
  compression_retries: 3
  prompt_template_path: null    # optional custom summarization prompt

retry_policy:
  enabled: false                # set true to activate premature-stop retry
  max_retries: 2                # retry attempts after the initial (total = 3)
  temperature_step: 0.3         # temperature added per retry attempt
  max_temperature: 1.5          # cap on bumped temperature
  default_temperature: 0.0      # base temperature when the request omits one
